<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>きょうのToDo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
  /* Layout: one narrow column, a note-pad card with an input row on top and the list below */
  :root {
    --bg: #eef1f4;
    --paper: #ffffff;
    --ink: #1d2733;
    --muted: #6a7684;
    --line: #dde3ea;
    --accent: #2f5d8a;   /* 藍 */
    --accent-ink: #ffffff;
    --done: #9aa5b1;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --paper: #1b222b; --ink: #e4e9ef; --muted: #8e9aa7;
      --line: #2c3540; --accent: #7fa8d4; --accent-ink: #0f1620; --done: #5d6875;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --paper: #1b222b; --ink: #e4e9ef; --muted: #8e9aa7;
    --line: #2c3540; --accent: #7fa8d4; --accent-ink: #0f1620; --done: #5d6875;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--font-display); font-size: 1.9rem; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
  .date { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }

  .profile { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px; }
  .profile label { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
  .profile input {
    font: inherit; font-size: 1rem; color: var(--ink); background: transparent; min-width: 0;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  }
  .profile input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .memo { display: grid; gap: 4px; padding: 0 14px 14px; font-size: 0.8rem; color: var(--muted); }
  .memo textarea {
    font: inherit; font-size: 1rem; color: var(--ink); background: transparent; resize: vertical;
    min-height: 72px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  }
  .memo textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .hello { padding: 0 14px 12px; color: var(--muted); font-size: 0.9rem; margin: 0; }
  @media (max-width: 420px) { .profile { grid-template-columns: 1fr; } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

  form { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); }
  #new-task {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  #new-task:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .btn-add {
    font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0 18px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .btn-add:hover { filter: brightness(1.08); }

  .filters { display: flex; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filters button {
    font: inherit; font-size: 0.88rem; color: var(--muted); background: transparent;
    border: 1px solid transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); font-weight: 700; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; cursor: pointer; }
  li .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li.done .text { color: var(--done); text-decoration: line-through; }
  .btn-del {
    flex: none; font: inherit; font-size: 0.85rem; color: var(--muted); background: transparent;
    border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer; opacity: 0.6;
  }
  li:hover .btn-del, .btn-del:focus-visible { opacity: 1; }
  .btn-del:hover { color: var(--ink); background: var(--bg); }

  .cloud { padding: 0 14px 14px; display: grid; gap: 8px; }
  .cloud-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cloud .btn-add { padding: 8px 14px; }
  .cloud-status { color: var(--muted); font-size: 0.85rem; min-width: 0; overflow-wrap: anywhere; }
  #cloud-list { border: 1px solid var(--line); border-radius: 10px; }
  #cloud-list:empty { display: none; }
  #cloud-list li { padding: 8px 12px; font-size: 0.92rem; justify-content: space-between; }
  #cloud-list .when { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

  .empty { padding: 28px 14px; text-align: center; color: var(--muted); }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88rem;
  }
  .count { font-variant-numeric: tabular-nums; }
  #clear-done { font: inherit; color: var(--muted); background: transparent; border: 0; cursor: pointer; text-decoration: underline; }
  #clear-done:hover { color: var(--ink); }
  #clear-done:disabled { opacity: 0.4; cursor: default; text-decoration: none; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="app">
  <header>
    <h1>きょうのToDo</h1>
    <span class="date" id="today"></span>
  </header>

  <section class="card">
    <div class="profile">
      <label for="user-id">ID
        <input id="user-id" type="text" placeholder="例：taro01" autocomplete="off" maxlength="32">
      </label>
      <label for="user-name">名前
        <input id="user-name" type="text" placeholder="例：山田 太郎" autocomplete="off" maxlength="32">
      </label>
    </div>
    <label class="memo" for="user-memo">備考
      <textarea id="user-memo" placeholder="メモや補足を自由に書けます" maxlength="500"></textarea>
    </label>
    <p class="hello" id="hello" hidden></p>
    <div class="cloud">
      <div class="cloud-row">
        <button type="button" id="save-cloud" class="btn-add">名前をSupabaseに保存</button>
        <span id="cloud-status" class="cloud-status" role="status"></span>
      </div>
      <ul id="cloud-list" aria-label="Supabaseに保存された名前"></ul>
    </div>
    <div style="border-top:1px solid var(--line)"></div>
    <form id="add-form">
      <input id="new-task" type="text" placeholder="やることを入力して Enter" autocomplete="off" aria-label="新しいタスク">
      <button class="btn-add" type="submit">追加</button>
    </form>
    <div class="filters" role="group" aria-label="表示の切り替え">
      <button type="button" data-filter="all" aria-pressed="true">すべて</button>
      <button type="button" data-filter="active" aria-pressed="false">未完了</button>
      <button type="button" data-filter="done" aria-pressed="false">完了</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden></p>
    <footer>
      <span class="count" id="count"></span>
      <button type="button" id="clear-done">完了したタスクを削除</button>
    </footer>
  </section>
</div>

<script>
  const KEY = "todo-app-v1";
  const SAMPLE = [
    { id: 1, text: "牛乳とパンを買う（例）", done: false },
    { id: 2, text: "メールの返信をする（例）", done: true },
    { id: 3, text: "30分ウォーキング（例）", done: false },
  ];

  let todos = load();
  let filter = "all";

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return SAMPLE.map(t => ({ ...t }));
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {}
  }

  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const clearBtn = document.getElementById("clear-done");

  function render() {
    const shown = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    list.innerHTML = "";
    for (const t of shown) {
      const li = document.createElement("li");
      if (t.done) li.className = "done";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.id = "todo-" + t.id;
      cb.checked = t.done;
      cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

      const label = document.createElement("label");
      label.className = "text";
      label.htmlFor = cb.id;
      label.textContent = t.text;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "btn-del";
      del.textContent = "削除";
      del.setAttribute("aria-label", "「" + t.text + "」を削除");
      del.addEventListener("click", () => { todos = todos.filter(x => x.id !== t.id); save(); render(); });

      li.append(cb, label, del);
      list.append(li);
    }

    const emptyText = { all: "タスクはありません。上の欄から追加できます。", active: "未完了のタスクはありません。", done: "完了したタスクはまだありません。" };
    empty.textContent = emptyText[filter];
    empty.hidden = shown.length > 0;

    const left = todos.filter(t => !t.done).length;
    count.textContent = `残り ${left} 件 / 全 ${todos.length} 件`;
    clearBtn.disabled = !todos.some(t => t.done);
  }

  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("new-task");
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    input.value = "";
    save();
    render();
  });

  document.querySelectorAll(".filters button").forEach(b => {
    b.addEventListener("click", () => {
      filter = b.dataset.filter;
      document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      render();
    });
  });

  clearBtn.addEventListener("click", () => { todos = todos.filter(t => !t.done); save(); render(); });

  const d = new Date();
  document.getElementById("today").textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;

  const PKEY = "todo-app-profile-v1";
  const idInput = document.getElementById("user-id");
  const nameInput = document.getElementById("user-name");
  const memoInput = document.getElementById("user-memo");
  const hello = document.getElementById("hello");

  function showHello() {
    const id = idInput.value.trim(), name = nameInput.value.trim();
    hello.hidden = !(id || name);
    hello.textContent = `${name || "名前未設定"} さん（ID: ${id || "未設定"}）のリスト`;
  }
  function saveProfile() {
    try { localStorage.setItem(PKEY, JSON.stringify({ id: idInput.value, name: nameInput.value, memo: memoInput.value })); } catch (e) {}
    showHello();
  }
  try {
    const p = JSON.parse(localStorage.getItem(PKEY) || "null");
    if (p) { idInput.value = p.id || ""; nameInput.value = p.name || ""; memoInput.value = p.memo || ""; }
  } catch (e) {}
  memoInput.addEventListener("input", saveProfile);
  idInput.addEventListener("input", saveProfile);
  nameInput.addEventListener("input", saveProfile);
  showHello();

  /* Supabase 連携: anon(publishable)キーだけをここに入れる。secret / service_role は入れない */
  const SB_URL = "https://ehtjtapkmwmsciuexdko.supabase.co";
  const SB_KEY = "sb_publishable_aWo4xCYUIH0sOJrE5DtSnQ_EukajdU5";
  const SB_TABLE = "Kambanoro2685";
  const SB_COL = "test氏名";

  const cloudStatus = document.getElementById("cloud-status");
  const cloudList = document.getElementById("cloud-list");
  const saveBtn = document.getElementById("save-cloud");

  function sbFetch(path, opts = {}) {
    return fetch(`${SB_URL}/rest/v1/${SB_TABLE}${path}`, {
      ...opts,
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", ...(opts.headers || {}) },
    }).then(async r => {
      if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 120)}`);
      return r;
    });
  }

  async function loadCloud() {
    if (!SB_KEY) { cloudStatus.textContent = "Supabaseのキーが未設定です"; saveBtn.disabled = true; return; }
    try {
      const rows = await (await sbFetch(`?select=id,created_at,${SB_COL}&order=created_at.desc&limit=10`)).json();
      cloudList.innerHTML = "";
      for (const row of rows) {
        const li = document.createElement("li");
        const n = document.createElement("span");
        n.textContent = row[SB_COL] || "(空)";
        const w = document.createElement("span");
        w.className = "when";
        w.textContent = new Date(row.created_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
        li.append(n, w);
        cloudList.append(li);
      }
      cloudStatus.textContent = rows.length ? `最新${rows.length}件を表示中` : "保存された名前はまだありません";
    } catch (e) {
      cloudStatus.textContent = "読み込みに失敗しました: " + e.message;
    }
  }

  saveBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    if (!name) { cloudStatus.textContent = "名前を入力してください"; return; }
    saveBtn.disabled = true;
    cloudStatus.textContent = "保存中…";
    try {
      await sbFetch("", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ [SB_COL]: name }) });
      await loadCloud();
      cloudStatus.textContent = "保存しました";
    } catch (e) {
      cloudStatus.textContent = "保存に失敗しました: " + e.message;
    } finally {
      saveBtn.disabled = !SB_KEY;
    }
  });

  loadCloud();

  render();
</script>

</body>
</html>
